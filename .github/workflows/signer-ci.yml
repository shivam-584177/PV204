name: Signer CI

on:
  push:
    branches: ["main", "shivam/**", "eni/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Run E2E integration test
        run: |
          chmod +x scripts/e2e_test.sh
          ./scripts/e2e_test.sh
